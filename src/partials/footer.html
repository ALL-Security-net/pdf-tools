{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="mt-16 border-t-2 border-gray-700 py-8">
  <div class="container mx-auto px-4">
    <div
      class="flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left"
    >
      <div>
        <div class="flex items-center justify-center md:justify-start mb-2">
          <img
            id="footer-logo"
            src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon.svg{{/if}}"
            alt="{{#if brandName}}{{brandName}}{{else}}PDF Tools{{/if}} Logo"
            class="h-10 w-10 mr-3"
          />
          <span id="footer-brand" class="text-xl font-bold text-white"
            >{{#if brandName}}{{brandName}}{{else}}PDF Tools{{/if}}</span
          >
        </div>
        <p
          id="footer-copyright"
          class="text-gray-400 text-sm"
          {{#unless footerText}}data-i18n="footer.copyright"{{/unless}}
        >
          {{#if footerText}}{{footerText}}{{else}}&copy; 2026 PDF Tools.{{/if}}
        </p>
        <p class="text-gray-400 text-xs mt-2">
          <span data-i18n="footer.version">Version</span>
          <span id="app-version">{{appVersion}}</span>
        </p>
      </div>

      <div>
        <ul
          class="flex flex-col md:flex-row gap-2 md:gap-6 text-gray-400 text-sm"
        >
          <li>
            <a
              href="tools.html"
              class="hover:text-indigo-400"
              data-i18n="nav.allTools"
              >All Tools</a
            >
          </li>
          <li>
            <a href="wasm-settings.html" class="hover:text-indigo-400"
              >Advanced Settings</a
            >
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>
{{/if}}
